<title>Lane Scout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
:root{
  --bg:#F1F3EF; --surface:#FBFCF9; --surface-2:#E7EBE3;
  --line:#D6DBD2; --line-strong:#BCC4B8;
  --ink:#151A18; --ink-2:#4C5652; --ink-3:#7B857F;
  --accent:#17786B; --accent-ink:#0C4D45; --accent-soft:#DCEDE8;
  --threat:#AC5326; --threat-ink:#7E3A18; --threat-soft:#F7E5D9;
  --even:#96A098; --even-soft:#E4E8E0;
  --shadow:0 1px 2px rgba(20,30,28,.05), 0 10px 26px -16px rgba(20,30,28,.30);
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1312; --surface:#151B19; --surface-2:#1C2422;
    --line:#27312E; --line-strong:#3A4643;
    --ink:#E7ECE8; --ink-2:#A5AFAA; --ink-3:#78837D;
    --accent:#47C4AD; --accent-ink:#8BE0CF; --accent-soft:#0F2E29;
    --threat:#E4884F; --threat-ink:#F2B487; --threat-soft:#2F1D10;
    --even:#6C756F; --even-soft:#232B29;
    --shadow:0 1px 2px rgba(0,0,0,.40), 0 12px 30px -18px rgba(0,0,0,.85);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1312; --surface:#151B19; --surface-2:#1C2422;
  --line:#27312E; --line-strong:#3A4643;
  --ink:#E7ECE8; --ink-2:#A5AFAA; --ink-3:#78837D;
  --accent:#47C4AD; --accent-ink:#8BE0CF; --accent-soft:#0F2E29;
  --threat:#E4884F; --threat-ink:#F2B487; --threat-soft:#2F1D10;
  --even:#6C756F; --even-soft:#232B29;
  --shadow:0 1px 2px rgba(0,0,0,.40), 0 12px 30px -18px rgba(0,0,0,.85);
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}

.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* ---------- scout bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar-inner{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;padding:14px 0 13px}
.mark{display:flex;flex-direction:column;gap:1px;margin-right:4px;padding-right:16px;border-right:1px solid var(--line)}
.mark b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.10em;text-transform:uppercase;line-height:1}
.mark span{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > label{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3)}
.champ{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line-strong);border-radius:3px;padding:5px 8px 5px 5px}
.champ:focus-within{border-color:var(--accent)}
.mono-tile{width:32px;height:32px;flex:none;display:grid;place-items:center;border-radius:2px;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.02em;color:#fff}
.mono-tile.you{background:var(--accent)}
.mono-tile.them{background:var(--threat)}
.champ input{border:0;background:transparent;color:var(--ink);font-family:var(--display);font-weight:600;font-size:19px;letter-spacing:.01em;width:152px;padding:2px 0}
.champ input:focus{outline:none}
.champ input::placeholder{color:var(--ink-3);font-weight:500}
.vs{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.18em;color:var(--ink-3);padding-bottom:12px}
.lanes{display:flex;gap:0;border:1px solid var(--line-strong);border-radius:3px;overflow:hidden}
.lanes button{border:0;border-right:1px solid var(--line);background:var(--bg);color:var(--ink-2);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:12px 9px;cursor:pointer}
.lanes button:last-child{border-right:0}
.lanes button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ctx{flex:1 1 190px;min-width:150px}
.ctx input{width:100%;border:1px solid var(--line-strong);border-radius:3px;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:14px;padding:11px 10px}
.ctx input::placeholder{color:var(--ink-3)}
.go{border:0;border-radius:3px;background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;padding:13px 24px;cursor:pointer;white-space:nowrap}
.go:hover:not(:disabled){background:var(--accent)}
.go:disabled{opacity:.42;cursor:not-allowed}
.barnote{width:100%;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;color:var(--ink-3);padding-bottom:2px}
.barnote.warn{color:var(--threat)}

/* ---------- recents ---------- */
.recents{display:flex;flex-wrap:wrap;align-items:center;gap:7px;padding:11px 0 0;border-top:1px solid var(--line);margin-top:2px}
.recents .rl{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--ink-3);margin-right:3px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink-2);border-radius:99px;font-family:var(--display);font-weight:600;font-size:13.5px;letter-spacing:.03em;padding:3px 11px;cursor:pointer}
.chip:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- brief head ---------- */
.head{padding:40px 0 26px}
.metaline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.badge{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:2px;background:var(--surface-2);color:var(--ink-2)}
.badge.hot{background:var(--threat-soft);color:var(--threat-ink)}
.stamp{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;color:var(--ink-3)}
.linkbtn{border:0;background:transparent;padding:0;color:var(--accent);font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
h1.title{font-family:var(--display);font-weight:700;font-size:clamp(40px,7vw,72px);line-height:.95;letter-spacing:-.005em;margin:0;text-wrap:balance}
h1.title .me{color:var(--accent)}
h1.title .sep{color:var(--ink-3);font-weight:500;font-size:.5em;vertical-align:.22em;letter-spacing:.1em;padding:0 .22em}
h1.title .op{color:var(--threat)}
.verdict{font-family:var(--body);font-size:19px;font-style:italic;color:var(--ink-2);margin:12px 0 0;max-width:60ch}
.verdict strong{font-style:normal;font-family:var(--display);font-weight:700;letter-spacing:.02em;color:var(--ink)}

/* ---------- layout ---------- */
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:44px;padding-bottom:72px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:1fr;gap:34px}}
.sec{margin-bottom:38px}
.sec:last-child{margin-bottom:0}
h2{font-family:var(--display);font-weight:700;font-size:12.5px;letter-spacing:.20em;text-transform:uppercase;color:var(--ink-3);margin:0 0 14px;padding-bottom:9px;border-bottom:1px solid var(--line)}
.prose{font-size:18px;line-height:1.62;margin:0;max-width:64ch;color:var(--ink)}

/* ---------- the tell ---------- */
.tell{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden;box-shadow:var(--shadow)}
.tell-top{display:flex;align-items:baseline;gap:11px;padding:15px 18px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.tell-top .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3)}
.tell-top .v{font-family:var(--display);font-weight:700;font-size:25px;letter-spacing:.01em;line-height:1.1;color:var(--ink)}
.windows{display:grid;grid-template-columns:1fr 1fr}
@media (max-width:620px){.windows{grid-template-columns:1fr}}
.win{padding:17px 18px 19px}
.win + .win{border-left:1px solid var(--line)}
@media (max-width:620px){.win + .win{border-left:0;border-top:1px solid var(--line)}}
.win .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;margin-bottom:9px}
.win .when{font-family:var(--display);font-weight:700;font-size:20px;line-height:1.15;margin-bottom:7px}
.win .what{font-size:15.5px;line-height:1.55;margin:0}
.win--them{background:var(--threat-soft)}
.win--them .who,.win--them .when,.win--them .what{color:var(--threat-ink)}
.win--them .what{opacity:.9}
.win--you{background:var(--accent-soft)}
.win--you .who,.win--you .when,.win--you .what{color:var(--accent-ink)}
.win--you .what{opacity:.9}

/* ---------- power curve ---------- */
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:11px}
.legend span{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.curve-bar{display:flex;gap:3px;height:44px}
.seg{border-radius:2px;display:grid;place-items:center;min-width:0;padding:0 4px}
.seg span{font-family:var(--mono);font-weight:500;font-size:11.5px;letter-spacing:.03em;color:#fff;white-space:nowrap;font-variant-numeric:tabular-nums}
.seg--you{background:var(--accent)}
.seg--them{background:var(--threat)}
.seg--even{background:var(--even)}
.curve-notes{display:flex;gap:3px;margin-top:8px}
.cnote{min-width:0;padding:0 2px;font-family:var(--mono);font-size:10.5px;line-height:1.45;letter-spacing:.01em;color:var(--ink-3)}

/* ---------- playing notes ---------- */
.notes{margin:0;padding:0;list-style:none}
.notes li{padding:16px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:26px 1fr;gap:14px}
.notes li:first-child{padding-top:2px}
.notes li:last-child{border-bottom:0}
.notes .dot{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);padding-top:6px;font-variant-numeric:tabular-nums}
.notes h3{font-family:var(--display);font-weight:700;font-size:21px;letter-spacing:.01em;line-height:1.2;margin:0 0 4px;color:var(--ink)}
.notes p{margin:0;font-size:16.5px;line-height:1.58;color:var(--ink-2);max-width:58ch}

/* ---------- build rail ---------- */
.rail{position:sticky;top:96px}
@media (max-width:900px){.rail{position:static}}
.item{display:grid;grid-template-columns:34px 1fr;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .slot{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding-top:6px;font-variant-numeric:tabular-nums}
.item .slot.n{color:var(--accent);font-weight:700;font-size:12px}
.item .nm{font-family:var(--display);font-weight:600;font-size:19px;line-height:1.2;letter-spacing:.01em;color:var(--ink)}
.item .wy{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:3px 0 0}
.item.sit .nm{font-size:17px}
.item.sit .wy{font-style:italic}
.item.sit .wy .ifk{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--threat);font-style:normal}

.keystone{background:var(--accent-soft);border:1px solid var(--accent);border-radius:3px;padding:12px 14px;margin-bottom:12px}
.keystone .nm{font-family:var(--display);font-weight:700;font-size:21px;line-height:1.15;color:var(--accent-ink)}
.keystone .wy{font-size:14.5px;line-height:1.5;color:var(--accent-ink);opacity:.88;margin:4px 0 0}
.runerow{display:grid;grid-template-columns:66px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:baseline}
.runerow:last-of-type{border-bottom:0}
.runerow .rk{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.runerow .rv{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.35;color:var(--ink)}
.runerow .rv em{font-style:normal;color:var(--ink-3)}
.sums{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sum{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.02em;padding:5px 13px;border:1px solid var(--line-strong);border-radius:3px;background:var(--surface);color:var(--ink)}
.railnote{font-size:14.5px;line-height:1.5;color:var(--ink-2);margin:0}
.caveat{margin-top:26px;padding:13px 15px;border-left:2px solid var(--line-strong);background:var(--surface);font-size:14px;line-height:1.55;color:var(--ink-3)}

/* ---------- states ---------- */
.state{padding:74px 0 96px;max-width:52ch}
.state .s1{font-family:var(--display);font-weight:700;font-size:31px;letter-spacing:.01em;margin:0 0 8px;color:var(--ink)}
.state .s2{font-size:17px;color:var(--ink-2);margin:0 0 18px}
.pulse{display:flex;gap:5px;margin-bottom:22px}
.pulse i{width:26px;height:5px;border-radius:99px;background:var(--line-strong);animation:pz 1.3s ease-in-out infinite}
.pulse i:nth-child(2){animation-delay:.13s}.pulse i:nth-child(3){animation-delay:.26s}
.pulse i:nth-child(4){animation-delay:.39s}.pulse i:nth-child(5){animation-delay:.52s}
@keyframes pz{0%,100%{background:var(--line-strong)}45%{background:var(--accent)}}
</style>

<div class="bar">
  <div class="wrap">
    <div class="bar-inner">
      <div class="mark"><b>Lane Scout</b><span>Champ-select briefs</span></div>

      <div class="field">
        <label for="you">You play</label>
        <div class="champ"><span class="mono-tile you" id="youTile">SE</span>
          <input id="you" list="champs" autocomplete="off" spellcheck="false" placeholder="Champion" value="Sett"></div>
      </div>

      <div class="vs">VS</div>

      <div class="field">
        <label for="them">Against</label>
        <div class="champ"><span class="mono-tile them" id="themTile">RE</span>
          <input id="them" list="champs" autocomplete="off" spellcheck="false" placeholder="Champion" value="Renekton"></div>
      </div>

      <div class="field">
        <label for="lanes">Lane</label>
        <div class="lanes" id="lanes" role="group" aria-label="Lane"></div>
      </div>

      <div class="field ctx">
        <label for="ctx">Anything else</label>
        <input id="ctx" placeholder="they took Ignite / I'm 0-2 down / enemy jungler is Ivern">
      </div>

      <button class="go" id="go">Scout</button>
      <div class="barnote" id="barnote" aria-live="polite"></div>
    </div>
    <div class="recents" id="recents" hidden></div>
  </div>
</div>

<datalist id="champs"></datalist>
<div class="wrap"><div id="app"></div></div>

<script>
/* ---------------- champion roster (free text is accepted too) ---------------- */
var CHAMPS = ["Aatrox","Ahri","Akali","Akshan","Alistar","Ambessa","Amumu","Anivia","Annie","Aphelios","Ashe","Aurelion Sol","Aurora","Azir","Bard","Bel'Veth","Blitzcrank","Brand","Braum","Briar","Caitlyn","Camille","Cassiopeia","Cho'Gath","Corki","Darius","Diana","Dr. Mundo","Draven","Ekko","Elise","Evelynn","Ezreal","Fiddlesticks","Fiora","Fizz","Galio","Gangplank","Garen","Gnar","Gragas","Graves","Gwen","Hecarim","Heimerdinger","Hwei","Illaoi","Irelia","Ivern","Janna","Jarvan IV","Jax","Jayce","Jhin","Jinx","K'Sante","Kai'Sa","Kalista","Karma","Karthus","Kassadin","Katarina","Kayle","Kayn","Kennen","Kha'Zix","Kindred","Kled","Kog'Maw","LeBlanc","Lee Sin","Leona","Lillia","Lissandra","Lucian","Lulu","Lux","Malphite","Malzahar","Maokai","Master Yi","Mel","Milio","Miss Fortune","Mordekaiser","Morgana","Naafiri","Nami","Nasus","Nautilus","Neeko","Nidalee","Nilah","Nocturne","Nunu & Willump","Olaf","Orianna","Ornn","Pantheon","Poppy","Pyke","Qiyana","Quinn","Rakan","Rammus","Rek'Sai","Rell","Renata Glasc","Renekton","Rengar","Riven","Rumble","Ryze","Samira","Sejuani","Senna","Seraphine","Sett","Shaco","Shen","Shyvana","Singed","Sion","Sivir","Skarner","Smolder","Sona","Soraka","Swain","Sylas","Syndra","Tahm Kench","Taliyah","Talon","Taric","Teemo","Thresh","Tristana","Trundle","Tryndamere","Twisted Fate","Twitch","Udyr","Urgot","Varus","Vayne","Veigar","Vel'Koz","Vex","Vi","Viego","Viktor","Vladimir","Volibear","Warwick","Wukong","Xayah","Xerath","Xin Zhao","Yasuo","Yone","Yorick","Yunara","Yuumi","Zac","Zed","Zeri","Ziggs","Zilean","Zoe","Zyra"];

/* ---------------- the brief the page opens on ---------------- */
var EXAMPLE = {
  you:"Sett", them:"Renekton", lane:"Top", context:"",
  brief:{
    verdict:{difficulty:"Hard early", line:"You lose levels 1–5 outright, and you win everything after 15 minutes."},
    thesis:"Renekton is one of the hardest early lane bullies in the game and Sett is one of the better late-game bruisers, so this lane is entirely about surviving levels 1–5. The saving grace is that Sett's W converts damage taken into grit while Renekton's all-in is front-loaded burst — his combo literally loads your gun. Most Setts lose this matchup by trying to trade first instead of letting him commit and W'ing back.",
    tell:{
      watch:"His Fury bar",
      theirWindow:{when:"50+ Fury", what:"Empowered W stuns and deals bonus max-health damage. Do not be in range. Back off, farm under tower, and let him shove the wave."},

    },
    powerCurve:[

      {levels:"11-18", edge:"you", note:"He falls off, you keep scaling"}
    ],

      core:[
        {item:"Trinity Force", why:"Proc damage and tempo. Stridebreaker instead if you want the slow to guarantee your R"},
        {item:"Sterak's Gage", why:"Bonus health, and the shield covers the exact window his burst would kill you in"},
        {item:"Death's Dance", why:"Armor plus damage postponement — turns his all-in into something you heal through after killing him"}

      situational:[

      secondary:["Triumph","Legend: Alacrity"],
      shards:["Ability Haste","Adaptive Force","Armor"]
    },
    summoners:{picks:["Flash","Teleport"], why:"Ghost only if you're confident you'll be ahead. At level 3, you usually won't be."},
    playing:[

      {title:"Hold E until his dashes are gone", detail:"Facebreaker is your only hard CC and he will simply E away from it. Use it once both charges are spent, to guarantee the W."},
      {title:"Ult him through his own R", detail:"Show Stopper scales off the target's bonus health and Dominus hands him a large chunk of it. His ultimate being up is a reason to commit, not to back off — as long as his Fury is spent."},
      {title:"Suppression beats his escape", detail:"Once Show Stopper lands, his E cannot get him out of it. That is your kill window at 6."},

};

/* ---------------- schema handed to Claude ---------------- */
var SHAPE = {
  verdict:{difficulty:"string", line:"string"},
  thesis:"string",
  tell:{watch:"string", theirWindow:{when:"string", what:"string"}, yourWindow:{when:"string", what:"string"}},
  powerCurve:[{levels:"string", edge:"you | them | even", note:"string"}],
  build:{
    start:{item:"string", why:"string"},
    boots:{item:"string", why:"string"},
    core:[{item:"string", why:"string"}],
    situational:[{item:"string", when:"string"}]
  },
  runes:{keystone:"string", keystoneWhy:"string", primary:["string"], secondary:["string"], shards:["string"]},
  summoners:{picks:["string"], why:"string"},
  playing:[{title:"string", detail:"string"}],
  patchCaveat:"string"
};

function buildPrompt(you, them, lane, ctx){
  return [
"You are a high-elo League of Legends coach writing a champ-select scouting brief.",
"",
"MATCHUP: the player is " + you + ". The enemy laner is " + them + ". Lane: " + lane + ".",
"PLAYER'S EXTRA CONTEXT: " + (ctx ? ctx : "none."),
"",
"Write the brief for the player PLAYING " + you + " INTO " + them + ". Never write it from the enemy's point of view.",

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }
function mono(n){ var t = String(n||"").replace(/[^A-Za-z]/g,""); return (t.slice(0,2) || "??").toUpperCase(); }
function slug(s){ return String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,60) || "x"; }
function keyFor(y,t,l){ return slug(y) + "__" + slug(t) + "__" + slug(l); }
function span(lv){
  var m = String(lv).match(/(\d+)\D+(\d+)/);
  if (m) return Math.max(1, (+m[2]) - (+m[1]) + 1);
  return 2;
}
function ago(ms){
  var d = Date.now() - ms;
  if (d < 6e4) return "just now";
  if (d < 36e5) return Math.round(d/6e4) + " min ago";
  if (d < 864e5) return Math.round(d/36e5) + "h ago";
  return Math.round(d/864e5) + "d ago";
}
function arr(v){ return Array.isArray(v) ? v : (v == null ? [] : [v]); }

/* ---------------- Riot icons ---------------- */

/* Names in a brief are prose ("Doran's Shield + Health Potion"), while Riot
   indexes by id — so match on the exact name first, then the best containment
   either way. Anything unmatched simply renders without an icon: the text has
   always been the thing carrying the meaning. */
var DD = "https://ddragon.leagueoflegends.com";
var iconCache = {};

function lookupIcon(kind, name){
  var map = ASSETS && ASSETS[kind];
  if (!map || !name) return null;
  var ck = kind + "|" + name;
  if (ck in iconCache) return iconCache[ck];

  var k = String(name).toLowerCase().trim();
  var file = map[k];

  if (!file){
    var best = null;
    for (var cand in map){
      if (k.indexOf(cand) !== -1 || cand.indexOf(k) !== -1){
        if (!best || cand.length > best.length) best = cand;
      }
    }
    if (best) file = map[best];
  }

  var url = null;
  if (file){
    if (kind === "rune")      url = DD + "/cdn/img/" + file;
    else if (kind === "item") url = DD + "/cdn/" + ASSETS.version + "/img/item/" + file;
    else if (kind === "spell")url = DD + "/cdn/" + ASSETS.version + "/img/spell/" + file;
    else if (kind === "champ")url = DD + "/cdn/" + ASSETS.version + "/img/champion/" + file;
  }
  iconCache[ck] = url;
  return url;
}

function iconImg(kind, name, cls){
  var url = lookupIcon(kind, name);
  if (!url) return "";
  return '<img class="ic ' + (cls || "") + '" src="' + esc(url) + '" alt="" loading="lazy" '
    + 'onerror="this.style.display=\'none\'">';
}

/* ---------------- progress ---------------- */

function etaPhrase(days){
  if (days <= 0)  return "complete";
  if (days < 1)   return "complete today";
  if (days < 2)   return "complete in about a day";
  if (days < 14)  return "complete in " + Math.round(days) + " days";
  if (days < 60)  return "complete in " + Math.round(days / 7) + " weeks";
  return "complete in " + Math.round(days / 30.4) + " months";
}

function renderProgress(){
  var box = $("progbox"); if (!box) return;
  var done = COVERAGE.done || 0, total = COVERAGE.total || 0;
  if (!total){ box.innerHTML = ""; return; }

  var pct = Math.min(100, (done / total) * 100);
  /* each line must be one element — .prog-line is a column flex container, so
     loose text nodes and inline tags would each become their own row */
  var lines = ["<b>" + done.toLocaleString() + "</b> of <b>" + total.toLocaleString() + "</b>"
    + " &middot; " + (pct < 0.1 && pct > 0 ? "&lt;0.1" : pct.toFixed(1)) + "%"];

  if (done >= total){
    lines.push('<span class="eta">every matchup written</span>');
  } else if (COVERAGE.ratePerDay > 0 && COVERAGE.etaDays != null){
    lines.push(COVERAGE.ratePerDay.toFixed(1) + "/day");
    lines.push('<span class="eta">' + etaPhrase(COVERAGE.etaDays) + "</span>");
  } else if (COVERAGE.why){
    lines.push(esc(COVERAGE.why));
  }

  box.innerHTML = '<div class="prog-track"><div class="prog-fill" style="width:' + pct.toFixed(2) + '%"></div></div>'
    + '<div class="prog-line">'
    + lines.map(function(l){ return "<div>" + l + "</div>"; }).join("")
    + '</div>';
}

/* ---------------- pins & history ---------------- */

function isPinned(key){ return pins.indexOf(key) !== -1; }
function live(list){ return list.filter(function(k){ return !!DATA.briefs[k]; }); }

function togglePin(key){
  var i = pins.indexOf(key);
  if (i === -1) pins.unshift(key); else pins.splice(i, 1);
  writeList(PINS_KEY, pins);
  renderRail();
  var btn = $("pinbtn");
  if (btn){
    btn.setAttribute("aria-pressed", String(isPinned(key)));
    btn.textContent = isPinned(key) ? "★ Saved" : "☆ Save";
  }
}

function remember(key){
  var i = recents.indexOf(key);
  if (i !== -1) recents.splice(i, 1);
  recents.unshift(key);
  recents = recents.slice(0, 12);
  writeList(RECENT_KEY, recents);
  renderRail();
}

    + '<span>' + esc(r.you) + " › " + esc(r.them) + '</span></button>';

function renderRail(){
  var p = live(pins);
  var r = live(recents).filter(function(k){ return p.indexOf(k) === -1; });

  $("sbpins").innerHTML = p.length
    ? p.map(function(k){ return sbRow(k, true); }).join("")
    : '<div class="sbempty">Star a matchup and it lands here.</div>';

  $("sbrecent").innerHTML = r.length
    ? r.map(function(k){ return sbRow(k, false); }).join("")
    : '<div class="sbempty">Matchups you open show up here.</div>';

  /* the old in-header rail is replaced by the sidebar */
  $("recents").hidden = true;
}

sb.addEventListener("click", function(e){
  var b = e.target.closest("button[data-key]"); if (!b) return;
  var rec = DATA.briefs[b.dataset.key]; if (!rec) return;
  $("you").value = rec.you; $("them").value = rec.them;
  syncTiles(); scout();
  if (window.innerWidth <= 900) setSidebar(false);
});

/* ---------------- champion picker ---------------- */

/* Replaces the native datalist. Clicking a field selects the text so typing
   overwrites it, and opens the full roster with portraits — the list is the
   point, not just autocomplete once you already know the name. */
["you", "them"].forEach(function(id){ $(id).removeAttribute("list"); });

var pick = document.createElement("div");
pick.id = "pick";
pick.hidden = true;
document.body.appendChild(pick);

var pickFor = null, pickSel = 0, pickList = [];

/* The field arrives already filled and selected, ready to be typed over. If we
   filtered by that existing value the panel would show one champion — the one
   you are about to replace. So the list stays unfiltered until you actually
   type a character. */
var pickTyped = false;

function pickCandidates(which, q){
  /* Always offer the whole roster. Showing only champions that happen to have
     a brief makes the app look broken: you go looking for Gnar, he is not
     there, and nothing explains why. Written ones sort first and are marked,
     the rest stay visible but dimmed, and picking one says plainly that it has
     not been written yet. */
  var covered = which === "them"
    ? (INDEX[$("you").value.trim()] || [])
    : COVERED;
  var all = covered.concat(CHAMPS.filter(function(c){ return covered.indexOf(c) === -1; }));
  if (!q) return all;
  var lq = q.toLowerCase();
  var starts = [], contains = [];
  all.forEach(function(c){
    var lc = c.toLowerCase();
    if (lc.indexOf(lq) === 0) starts.push(c);
    else if (lc.replace(/[^a-z]/g, "").indexOf(lq.replace(/[^a-z]/g, "")) !== -1) contains.push(c);
  });
  return starts.concat(contains);
}

function hasBrief(which, champ){
  if (which === "you") return !!INDEX[champ];
  var you = $("you").value.trim();
  return (INDEX[you] || []).indexOf(champ) !== -1;
}

function placePick(input){
  var r = input.getBoundingClientRect();
  pick.style.left = Math.max(8, Math.min(r.left, window.innerWidth - 334)) + "px";
  pick.style.top = (r.bottom + 6) + "px";
  pick.style.position = "fixed";
}

function renderPick(){
  if (!pickFor) return;
  var input = $(pickFor);
  pickList = pickCandidates(pickFor, pickTyped ? input.value.trim() : "");
  if (pickSel >= pickList.length) pickSel = 0;

  var written = pickList.filter(function(c){ return hasBrief(pickFor, c); }).length;
  var hint = (pickFor === "them" ? "opponents" : "champions")
    + " — " + written + " written, dimmed ones not yet";

  pick.innerHTML = pickList.length
    ? '<div class="pickhint">' + hint + '</div><div class="pgrid">'
      + pickList.slice(0, 120).map(function(c, i){
          return '<button class="pick-it ' + (hasBrief(pickFor, c) ? "has" : "none")
            + (i === pickSel ? " sel" : "") + '" data-champ="' + esc(c) + '">'
            + iconImg("champ", c, "sm") + '<span>' + esc(c) + '</span></button>';
        }).join("") + '</div>'
    : '<div class="pick-none">No champion matches that.</div>';

  placePick(input);
  pick.hidden = false;
}

function closePick(){ pick.hidden = true; pickFor = null; }

function choose(champ){
  if (!pickFor) return;
  var which = pickFor;
  $(which).value = champ;
  syncTiles();
  closePick();
  if (which === "you"){
    // opponent may no longer be covered for this champion — let them pick again
    $("them").focus();
  } else {
    scout();
  }
}

["you", "them"].forEach(function(id){
  var el = $(id);
  el.addEventListener("focus", function(){
    el.select();                 // typing overwrites instead of appending
    pickFor = id; pickSel = 0; pickTyped = false; renderPick();
  });
  el.addEventListener("click", function(){
    if (pick.hidden){ pickFor = id; pickSel = 0; pickTyped = false; renderPick(); }
  });
  el.addEventListener("input", function(){
    pickFor = id; pickSel = 0; pickTyped = true; renderPick();
  });
  el.addEventListener("keydown", function(e){
    if (pick.hidden) return;
    if (e.key === "ArrowDown" || e.key === "ArrowUp"){
      e.preventDefault();
      pickSel += (e.key === "ArrowDown" ? 1 : -1);
      if (pickSel < 0) pickSel = pickList.length - 1;
      if (pickSel >= pickList.length) pickSel = 0;
      renderPick();
      var selEl = pick.querySelector(".pick-it.sel");
      if (selEl) selEl.scrollIntoView({ block: "nearest" });
    } else if (e.key === "Enter"){
      e.preventDefault();
      if (pickList[pickSel]) choose(pickList[pickSel]);
    } else if (e.key === "Escape"){
      closePick();
    }
  });
  el.addEventListener("blur", function(){
    // let a click on the panel land before it closes
    setTimeout(function(){ if (pickFor === id) closePick(); }, 140);
  });
});

pick.addEventListener("mousedown", function(e){ e.preventDefault(); });
pick.addEventListener("click", function(e){
  var b = e.target.closest("button[data-champ]"); if (!b) return;
  choose(b.dataset.champ);
});
window.addEventListener("resize", function(){ if (!pick.hidden && pickFor) placePick($(pickFor)); });
window.addEventListener("scroll", function(){ if (!pick.hidden && pickFor) placePick($(pickFor)); }, true);

/* ---------------- rendering ---------------- */

/* Overrides the plain-text version from the template so build rows carry
   Riot's item art. Declared later in the same scope, so every caller — the
   renderer included — picks this up. */
function itemRow(it, slotLabel, numbered, sit){
  if (!it) return "";
  var why = sit ? '<span class="ifk">IF </span>' + esc(it.when) : esc(it.why);
  return '<div class="item' + (sit ? " sit" : "") + '">'
    + '<div class="slot' + (numbered ? " n" : "") + '">' + esc(slotLabel) + '</div>'
    + '<div><div class="nm">' + iconImg("item", it.item) + '<span>' + esc(it.item) + '</span></div>'
    + '<p class="wy">' + why + '</p></div></div>';
}

/* Runes and summoners are built inside the template's renderer, so decorate
   them afterwards from the same data rather than duplicating the renderer. */
/* ---------------- ability kits and hover cards ---------------- */

var CDRAGON = "https://raw.communitydragon.org/latest/plugins/rcp-be-lol-game-data/global/default";
function kitOf(name){ return KITS[String(name || "").toLowerCase()] || null; }
function abIcon(p){ return p ? CDRAGON + p : null; }

function abilityRow(a, keyLabel){
  var url = abIcon(a.icon);
  var meta = [];
  if (a.cooldown && a.cooldown.length) meta.push("cooldown " + a.cooldown.join("/") + "s");
  if (a.range) meta.push("range " + a.range);
  return '<div class="ab-row">'
    + '<div class="icw">'
    + (url ? '<img src="' + esc(url) + '" alt="" loading="lazy" onerror="this.style.visibility=\'hidden\'">' : '<img alt="">')
    + '<span class="kbd">' + esc(keyLabel) + '</span></div>'
    + '<div><div class="an">' + esc(a.name || "") + '</div>'
    + (meta.length ? '<p class="ameta">' + esc(meta.join(" · ")) + '</p>' : "")
    + '<p class="ad">' + esc(a.description || "") + '</p></div></div>';
}

function kitHtml(name, side){
  var k = kitOf(name);
  if (!k) return "";
  var rows = [abilityRow(k.passive, "P")]
    .concat((k.spells || []).map(function(s){ return abilityRow(s, s.key); }))
    .join("");
  return '<div class="kit ' + side + '">'
    + '<h3>' + iconImg("champ", k.name, "sm") + esc(k.name) + '</h3>'
    + '<p class="sub">' + esc([k.title, k.attackType, k.damageType ? k.damageType + " damage" : null]
        .filter(Boolean).join(" · ")) + '</p>'
    + rows + '</div>';
}

function kitsSection(rec){
  if (!kitOf(rec.you) && !kitOf(rec.them)) return "";
  return '<section class="sec"><h2>Abilities</h2><div class="kits">'
    + kitHtml(rec.you, "you") + kitHtml(rec.them, "them")
    + '</div></section>';
}

/* --- hover cards ---------------------------------------------------- */

var tip = document.createElement("div");
tip.id = "tip"; tip.hidden = true;
document.body.appendChild(tip);

function showTip(el){
  var kind = el.dataset.tipKind, name = el.dataset.tipName, champ = el.dataset.tipChamp;
  var title = "", meta = "", body = "", icon = "";

  if (kind === "ability"){
    var k = kitOf(champ); if (!k) return;
    var all = [k.passive].concat(k.spells || []);
    var a = all.find(function(x){ return String(x.name || "").toLowerCase() === String(name).toLowerCase(); });
    if (!a) return;
    title = a.name;
    var m = [];
    if (a.cooldown && a.cooldown.length) m.push("cooldown " + a.cooldown.join("/") + "s");
    if (a.range) m.push("range " + a.range);
    m.push(k.name);
    meta = m.join(" · ");
    body = a.description || "";
    var u = abIcon(a.icon);
    if (u) icon = '<img src="' + esc(u) + '" alt="">';
  } else {
    var t = ITEMTEXT[String(name).toLowerCase()];
    if (!t) return;
    /* ITEMTEXT is keyed lowercase; show the item the way the page spells it. */
    title = el.textContent || name;
    body = t;
    icon = iconImg("item", name, "");
  }

  tip.innerHTML = '<div class="tt">' + icon + esc(title) + '</div>'
    + (meta ? '<div class="tm">' + esc(meta) + '</div>' : "")
    + '<div class="tb">' + esc(body) + '</div>';
  tip.hidden = false;

  var r = el.getBoundingClientRect(), t2 = tip.getBoundingClientRect();
  var left = Math.min(Math.max(8, r.left), window.innerWidth - t2.width - 8);
  var top = r.bottom + 8;
  if (top + t2.height > window.innerHeight - 8) top = Math.max(8, r.top - t2.height - 8);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}
function hideTip(){ tip.hidden = true; }

document.addEventListener("mouseover", function(e){
  var el = e.target.closest(".tipref");
  if (el) showTip(el); else if (!e.target.closest("#tip")) hideTip();
});
document.addEventListener("focusin", function(e){
  var el = e.target.closest(".tipref"); if (el) showTip(el);
});
document.addEventListener("scroll", hideTip, true);

/* Wrap ability mentions like "W (Haymaker)" or bare "Facebreaker", and item
   names, so they carry a hover card. Only exact known names are touched — the
   prose is never rewritten, only marked up. */
function annotate(root, you, them){
  var targets = [];
  [[you, "you"], [them, "them"]].forEach(function(pair){
    var k = kitOf(pair[0]); if (!k) return;
    [k.passive].concat(k.spells || []).forEach(function(a){
      if (a && a.name) targets.push({ name: a.name, kind: "ability", champ: pair[0] });
    });
  });
  for (var n in ITEMTEXT) targets.push({ name: n, kind: "item", champ: null });

  // longest first so "Black Cleaver" wins over "Cleaver"
  targets.sort(function(a, b){ return b.name.length - a.name.length; });

  var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: function(node){
      if (!node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      if (node.parentElement.closest(".tipref, .ab-row, script, style, h1, #tip")) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });

  var nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);

  nodes.forEach(function(node){
    var text = node.nodeValue, hit = null, at = -1;
    for (var i = 0; i < targets.length; i++){
      var idx = text.toLowerCase().indexOf(targets[i].name.toLowerCase());
      if (idx !== -1){ hit = targets[i]; at = idx; break; }
    }
    if (!hit) return;
    var span = document.createElement("span");
    span.className = "tipref";
    span.tabIndex = 0;
    span.dataset.tipKind = hit.kind;
    span.dataset.tipName = hit.name;
    if (hit.champ) span.dataset.tipChamp = hit.champ;
    span.textContent = text.slice(at, at + hit.name.length);

    var after = node.splitText(at);
    after.nodeValue = after.nodeValue.slice(hit.name.length);
    node.parentNode.insertBefore(span, after);
  });
}

/* Skill order comes straight from the measured data, not from the model —
   there is no reason to round-trip a fact through a language model. One cell
   per level, with the ultimate picked out. */
function skillOrderHtml(rec){
  var so = rec && rec.stats && rec.stats.skillOrder && rec.stats.skillOrder[0];
  var order = so && so.order;
  if (!order || !order.length) return "";

  var cells = order.map(function(ab, i){
    var a = String(ab).toUpperCase();
    return '<div class="sk ' + a.toLowerCase() + '">'
      + '<div class="lv">' + (i + 1) + '</div>'
      + '<div class="ab">' + esc(a) + '</div></div>';
  }).join("");

  return '<section class="sec"><h2>Skill order</h2>'
    + '<div class="skills">' + cells + '</div>'
    + (so.winRate != null
        ? '<p class="skillnote">' + so.winRate + '% over ' + so.play + ' games</p>'
        : "")
    + '</section>';
}

function decorate(brief, rec){
  var runes = brief.runes || {};

  var ks = document.querySelector(".keystone .nm");
  if (ks && runes.keystone){
    ks.innerHTML = iconImg("rune", runes.keystone, "lg rune") + "<span>" + esc(runes.keystone) + "</span>";
  }

  var rows = document.querySelectorAll(".runerow");
  var sets = [runes.primary, runes.secondary, runes.shards];
  for (var i = 0; i < rows.length && i < sets.length; i++){
    var list = arr(sets[i]);
    if (!list.length) continue;
    var rv = rows[i].querySelector(".rv");
    if (!rv) continue;
    // shards have no Riot art; they render as plain text
    rv.innerHTML = list.map(function(n){
      var ic = i === 2 ? "" : iconImg("rune", n, "sm rune");
      return '<span class="rn">' + ic + esc(n) + "</span>";
    }).join('<em>/</em>');
  }

  var picks = arr(brief.summoners && brief.summoners.picks);
  var sums = document.querySelectorAll(".sum");
  for (var j = 0; j < sums.length && j < picks.length; j++){
    sums[j].innerHTML = iconImg("spell", picks[j], "sm") + "<span>" + esc(picks[j]) + "</span>";
  }

  /* Slot the skill order into the rail, straight after the build order. */
  var html = skillOrderHtml(rec);
  if (html){
    var rail = document.querySelector(".rail");
    var secs = rail && rail.querySelectorAll(".sec");
    if (rail && secs && secs.length){
      var holder = document.createElement("div");
      holder.innerHTML = html;
      rail.insertBefore(holder.firstChild, secs[1] || null);
    }
  }

  /* Full kits go in the main column, below the narrative. */
  var kits = kitsSection(rec);
  if (kits){
    var main = document.querySelector(".grid > div");
    if (main){
      var kh = document.createElement("div");
      kh.innerHTML = kits;
      main.appendChild(kh.firstChild);
    }
  }

  /* Then mark up every ability and item mention so it carries a hover card. */
  hideTip();
  var grid = document.querySelector(".grid");
  if (grid) annotate(grid, rec.you, rec.them);
}

function stampMeta(rec, key, shownContext){
  var m = document.querySelector(".metaline");
  if (!m) return;
  var bits = [];

  if (!shownContext){
    bits.push('<button class="pinbtn" id="pinbtn" aria-pressed="' + isPinned(key) + '">'
      + (isPinned(key) ? "★ Saved" : "☆ Save") + '</button>');
  } else {
    bits.push('<span class="badge hot">rewritten for: ' + esc(shownContext) + '</span>');
    bits.push('<button class="pinbtn" id="backbtn">↩ standard brief</button>');
  }

  bits.push('<span class="stamp">written ' + esc(new Date(rec.generatedAt).toISOString().slice(0, 10)) + '</span>');
  if (rec.patch) bits.push('<span class="badge">patch ' + esc(rec.patch) + '</span>');
  if (LIVE_PATCH && rec.patch && LIVE_PATCH !== rec.patch){
    bits.push('<span class="badge hot">live is ' + esc(LIVE_PATCH) + '</span>');
  }
  if (CONTEXT_FEATURE && !shownContext && CAN_GENERATE && state.ctx){
    bits.push('<button class="pinbtn" id="ctxbtn">↻ rewrite for “' + esc(state.ctx) + '”</button>');
  }

  m.innerHTML = bits.join("");

  var pb = $("pinbtn");  if (pb) pb.addEventListener("click", function(){ togglePin(key); });
  var cb = $("ctxbtn");  if (cb) cb.addEventListener("click", function(){ generateNow(state.you, state.them, state.ctx); });
  var bb = $("backbtn"); if (bb) bb.addEventListener("click", function(){ VARIANT = null; scout(); });
}

/* ---------------- writing on demand ---------------- */

function showWriting(you, them, ctx){
  $("app").innerHTML = '<div class="state"><div class="pulse"><i></i><i></i><i></i><i></i><i></i></div>'
    + '<p class="s1">' + (ctx ? "Rewriting " : "Writing ") + esc(you) + ' into ' + esc(them) + '</p>'
    + '<p class="s2" aria-live="polite">Takes about a minute. It gets saved, so this only ever happens once '
      + 'for a given matchup — and anyone you sent the file to picks it up on their next launch.</p></div>';
}

function generateNow(you, them, context){
  var lane = state.lane;
  var ctx = (context || "").trim();
  showWriting(you, them, ctx);

  fetch("/api/generate", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ you: you, them: them, lane: lane, context: ctx })
  })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if (!j.ok){
        $("app").innerHTML = '<div class="state">'
          + '<p class="s1">Couldn’t write that one</p>'
          + '<p class="s2">' + esc(j.error || "unknown error") + '</p>'
          + (j.suggestLanes && j.suggestLanes.length
              ? '<div style="display:flex;gap:8px;flex-wrap:wrap">' + j.suggestLanes.map(function(l){
                  return '<button class="go" data-lane-retry="' + esc(l) + '">Write it for ' + esc(l) + '</button>';
                }).join("") + '</div>'
              : j.fatal
                ? '<p class="s2">That usually means the account is out of room for now, or the CLI needs signing in again.</p>'
                : '<button class="go" id="retryGen">Try again</button>')
          + '</div>';
        var rb = $("retryGen");
        if (rb) rb.addEventListener("click", function(){ generateNow(you, them, ctx); });
        Array.prototype.forEach.call(document.querySelectorAll("[data-lane-retry]"), function(b){
          b.addEventListener("click", function(){
            var lb = $("lanes").querySelector('[data-lane="' + b.dataset.laneRetry + '"]');
            if (lb) lb.click();          // switch the lane selector, then write it there
            generateNow(you, them, ctx);
          });
        });
        return;
      }

      var rec = j.record;
      if (j.variant){
        VARIANT = rec;
        render({ you: rec.you, them: rec.them, lane: rec.lane, context: rec.context, brief: rec.brief },
               { kind: "offline" });
        decorate(rec.brief, rec);
        stampMeta(rec, keyFor(rec.you, rec.them, rec.lane), rec.context);
        window.scrollTo({ top: 0, behavior: "smooth" });
        return;
      }

      DATA.briefs[keyFor(rec.you, rec.them, rec.lane)] = rec;
      DATA.builtAt = Math.max(DATA.builtAt || 0, rec.generatedAt || 0);
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(DATA)); } catch (e) {}
      reindex();
      $("you").value = rec.you; $("them").value = rec.them;
      syncTiles();
      scout();
      setNote(baseNote() + " · just written", false);
      fetch("/api/status", { cache: "no-store" })
        .then(function(r){ return r.ok ? r.json() : null; })
        .then(function(st){ if (st && st.coverage){ COVERAGE = st.coverage; renderProgress(); } })
        .catch(function(){});
    })
    .catch(function(e){
      $("app").innerHTML = '<div class="state"><p class="s1">Lost the connection</p>'
        + '<p class="s2">The local server stopped responding — ' + esc(e.message) + '. '
        + 'Restart it with <code>node scripts/serve.mjs</code>.</p></div>';
    });
}

/* ---------------- lookup ---------------- */

function showMissing(you, them){
  var mine = INDEX[you] || [];
  $("app").innerHTML = '<div class="state">'
    + '<p class="s1">' + (CAN_GENERATE ? "Not written yet" : "Not in this build") + '</p>'
    + '<p class="s2">' + esc(you) + ' into ' + esc(them) + ' hasn’t been written yet. '
      + (CAN_GENERATE
          ? 'You can write it now — it takes about a minute, gets saved permanently, and goes out to everyone else on their next launch.'
          : 'This file ships a fixed set of matchups and checks for newer ones on launch, '
            + 'so it can only show what has been written so far.') + '</p>'
    + (CAN_GENERATE ? '<button class="go" id="genbtn" style="margin-bottom:22px">Write this matchup</button>' : "")
    + (mine.length
        ? '<p class="s2" style="margin-bottom:8px"><strong>' + esc(you) + '</strong> is covered against:</p>'
          + '<div class="browse" style="display:flex;flex-wrap:wrap;gap:7px">'
          + mine.map(function(t){
              return '<button class="chip" data-them="' + esc(t) + '">'
                + iconImg("champ", t, "sm") + " " + esc(t) + '</button>'; }).join("")
          + '</div>'
        : '<p class="s2">Nothing for <strong>' + esc(you) + '</strong> yet.</p>')
    + '</div>';

  $("app").onclick = function(e){
    var g = e.target.closest("#genbtn");
    if (g){ generateNow(you, them, CONTEXT_FEATURE ? state.ctx : ""); return; }
    var b = e.target.closest("button[data-them]"); if (!b) return;
    $("them").value = b.dataset.them; syncTiles(); scout();
  };
}

function scout(){
  syncTiles();
  var you = state.you, them = state.them, lane = state.lane;
  if (!you || !them) return;

  var key = keyFor(you, them, lane);
  var rec = DATA.briefs[key];
  if (!rec){ showMissing(you, them); return; }

  render({ you: rec.you, them: rec.them, lane: rec.lane, context: "", brief: rec.brief },
         { kind: "offline" });
  decorate(rec.brief, rec);
  stampMeta(rec, key);
  remember(key);
  window.scrollTo({ top: 0, behavior: "smooth" });
}

var lastRendered = null, autoTimer = null;
function maybeAuto(){
  clearTimeout(autoTimer);
  autoTimer = setTimeout(function(){
    var k = keyFor($("you").value.trim(), $("them").value.trim(), state.lane);
    if (DATA.briefs[k] && k !== lastRendered){ lastRendered = k; scout(); }
  }, 120);
}
["you", "them"].forEach(function(id){ $(id).addEventListener("input", maybeAuto); });
$("go").addEventListener("click", function(){ closePick(); scout(); });

function renderCurrent(){
  if (DATA.briefs[currentKey()]){ scout(); return; }
  var resume = live(recents)[0] || live(pins)[0] || Object.keys(DATA.briefs)[0];
  if (resume){
    var r = DATA.briefs[resume];
    $("you").value = r.you; $("them").value = r.them;
    syncTiles(); scout();
  } else {
    render(EXAMPLE, { kind: "example" });
  }
}

/* ---------------- background checks ---------------- */

function checkPatch(){
  fetch(DD + "/api/versions.json", { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(v){
      if (!v || !v.length) return;
      LIVE_PATCH = v[0];
      if (DATA.patch && LIVE_PATCH !== DATA.patch){
        setNote(baseNote() + " · live is " + LIVE_PATCH + ", some briefs may be stale", true);
      }
      renderCurrent();
    })
    .catch(function(){});
}

function checkForNewData(){
  if (!REMOTE_URL) return;
  fetch(REMOTE_URL, { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.briefs || !(j.builtAt > DATA.builtAt)) return;
      var before = briefCount();
      DATA = { briefs: j.briefs, patch: j.patch, builtAt: j.builtAt };
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(DATA)); } catch (e) {}
      reindex();
      renderRail();
      COVERAGE = { done: j.count || briefCount(), total: j.target || COVERAGE.total };
      renderProgress();
      renderCurrent();
      var added = briefCount() - before;
      setNote(baseNote() + (added > 0 ? " · updated, +" + added + " new" : " · updated"), false);
    })
    .catch(function(){});
}

function checkLocalApi(){
  if (location.protocol !== "http:" && location.protocol !== "https:") return;
  fetch("/api/status", { cache: "no-store" })
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){
      if (!j || !j.canGenerate) return;
      CAN_GENERATE = true;
      if (CONTEXT_FEATURE) document.querySelector(".ctx").hidden = false;
      if (j.coverage){ COVERAGE = j.coverage; renderProgress(); }
      setNote(baseNote() + " · writing enabled", false);
      if (!DATA.briefs[currentKey()] && state.you && state.them) showMissing(state.you, state.them);
    })
    .catch(function(){});
}

/* ---------------- boot ---------------- */
(function(){
  document.querySelector(".ctx").hidden = true;

  renderRail();
  renderProgress();
  setNote(briefCount() ? baseNote() : "This build has no matchups baked in yet.", false);
  renderCurrent();
  syncTiles();

  checkLocalApi();
  checkPatch();
  checkForNewData();
})();

</script>
